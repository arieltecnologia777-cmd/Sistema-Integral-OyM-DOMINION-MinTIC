<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Análisis de Observaciones</title>

<style>
body{
  font-family:Segoe UI,Arial,sans-serif;
  background:#0f172a;
  color:#fff;
  margin:0;
  padding:30px;
}

.card{
  background:#1e293b;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}

input{
  width:300px;
  padding:12px;
  border-radius:10px;
  border:none;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#22c55e;
  color:white;
  font-weight:bold;
}

h1,h2{
  margin-top:0;
}

.badge{
  display:inline-block;
  padding:8px 12px;
  border-radius:999px;
  background:#334155;
  margin:5px;
}

#summary{
  line-height:1.8;
}

.obs{
  padding:10px;
  border-bottom:1px solid #334155;
}
</style>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

<body>

<h1>📊 Analizador de Observaciones</h1>

<div class="card">
<input id="txtId" placeholder="Ingrese ID">
<button onclick="analizar()">Analizar</button>
</div>

<div class="card">
<h2>Resumen Ejecutivo</h2>
<div id="summary">Ingrese un ID</div>
</div>

<div class="card">
<h2>Categorías Detectadas</h2>
<div id="categories"></div>
</div>

<div class="card">
<h2>Observaciones Encontradas</h2>
<div id="obsList"></div>
</div>

<script>

const CSV_URL =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vRaTszHaU4PLm00tAvMRpAUnz1C8xzrcLi-CYSNbqkVGpX-BNKMIJiyuJIqoY5CAdEjMFmqHj-sgNAb/pub?gid=0&single=true&output=csv';

const ID_COLUMN = 'ID';
const OBS_COLUMN = 'Observaciones';

const categorias = {

  Energia: [
    'energia',
    'electrica',
    'electrico',
    'transformador',
    'acometida',
    'breaker',
    'breakers',
    'poste',
    'fluido',
    'apagon',
    'sin luz',
    'sin energia',
    'hurtada',
    'hurto'
  ],

  Conectividad: [
    'internet',
    'enlace',
    'conexion',
    'latencia',
    'fibra',
    'senal',
    'señal',
    'navegacion',
    'navegación',
    'red'
  ],

  Equipos: [
    'router',
    'switch',
    'radio',
    'antena',
    'ups',
    'equipo'
  ],

  Acceso: [
    'cerrada',
    'cerrado',
    'receso',
    'vacaciones',
    'sin acceso',
    'no fue posible ingresar',
    'no se permite el ingreso'
  ],

  Seguridad: [
    'hurto',
    'hurtada',
    'robo',
    'vandalismo',
    'vandalizada'
  ],

  Administrativo: [
    'pqr',
    'peticion',
    'queja',
    'reclamo'
  ]

};
function normalize(text){

  return String(text || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'');

}



async function analizar(){

  const id=document.getElementById('txtId').value.trim();

  if(!id) return;

  const response=await fetch(CSV_URL);

  const text=await response.text();

  console.log(text.includes('30508'));
console.log(text.substring(text.indexOf('30508'), text.indexOf('30508') + 1000));

  const rows = Papa.parse(text,{
  header:true,
  skipEmptyLines:true
}).data;
  const fila30508 = rows.find(r => String(r.ID).trim() === '30508');
  console.log(
  'OBS REAL:',
  fila30508['Observaciones\r']
);

console.log('30508:', fila30508);
console.log(Object.keys(fila30508));

  console.log(rows[0]);

  console.log('ID buscado:', id);

console.log(
  'Primeros IDs:',
  rows.slice(0,20).map(r => r.ID)
);

const registros=rows.filter(r=>
  String(r.ID || '').trim()===id
);


  const observaciones=
    registros.map(r=>r[OBS_COLUMN])
    .filter(Boolean);

  if(!observaciones.length){

    document.getElementById('summary').innerHTML=
      'No se encontraron observaciones';

    return;

  }

  const contador={};

  observaciones.forEach(obs=>{

    const texto=normalize(obs);

    Object.keys(categorias).forEach(cat=>{

      categorias[cat].forEach(key=>{

        if(texto.includes(key)){

          contador[cat]=(contador[cat]||0)+1;

        }

      });

    });

  });

  let top='Sin clasificar';
  let severidad = 'Baja';

if(
  contador.Energia ||
  contador.Seguridad
){
  severidad = 'Alta';
}

if(
  contador.Seguridad &&
  contador.Energia
){
  severidad = 'Crítica';
}

  if(Object.keys(contador).length){

    top=Object.entries(contador)
      .sort((a,b)=>b[1]-a[1])[0][0];

  }

  document.getElementById('summary').innerHTML=
`
<b>Observaciones analizadas:</b>
${observaciones.length}

<br><br>

<b>Categoría principal:</b>
${top}

<br><br>

<b>Severidad:</b>
${severidad}

<br><br>

<b>Hallazgo principal:</b>

${
top === 'Energia'
? 'Se identifican afectaciones relacionadas con suministro eléctrico o infraestructura energética.'
:
top === 'Conectividad'
? 'Se identifican problemas asociados con conectividad y acceso a red.'
:
top === 'Equipos'
? 'Se identifican incidentes relacionados con equipos tecnológicos.'
:
top === 'Acceso'
? 'Se identifican limitaciones de acceso a la sede o institución.'
:
top === 'Seguridad'
? 'Se identifican eventos relacionados con hurto o afectaciones de seguridad.'
:
'No fue posible determinar una causa predominante.'
}
`;

  document.getElementById('categories').innerHTML=
    Object.entries(contador)
      .sort((a,b)=>b[1]-a[1])
      .map(x=>
        `<span class="badge">${x[0]} (${x[1]})</span>`
      )
      .join('');

  document.getElementById('obsList').innerHTML=
    observaciones
      .map(o=>`<div class="obs">${o}</div>`)
      .join('');
}

</script>

</body>
</html>
